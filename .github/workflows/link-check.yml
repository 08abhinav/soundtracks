name: Check streaming links

# Weekly check of every Spotify and Apple Music link in all-games.json.
# Dead links end up in one issue per platform (labels "broken link" + the
# platform), which the next run updates and closes once everything works.
# album.link answers 200 even for albums that do not exist, so it is skipped.

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      # The repo has ~200k placeholder files; only all-games.json is needed.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: all-games.json
          sparse-checkout-cone-mode: false

      - name: Collect links
        run: |
          jq -r '.games[].albums[] | .spotify_url, .apple_music_url | select(. != null and . != "")' all-games.json \
            | sort -u > links.txt
          echo "$(wc -l < links.txt) links to check"

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --format json
            --max-concurrency 4
            --max-retries 3
            --retry-wait-time 15
            --timeout 30
            --user-agent "Mozilla/5.0 (compatible; OSTDB link checker; +https://ostdb.net)"
            links.txt
          output: lychee.json
          fail: false
          jobSummary: false

      - name: Open or update issues
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const { owner, repo } = context.repo;
            const report = JSON.parse(fs.readFileSync("lychee.json", "utf8"));
            const failures = Object.values(report.error_map ?? report.fail_map ?? {}).flat();
            // Only a real "gone": 404/410. Rate limits, timeouts and 403s are not dead links.
            const dead = new Map();
            for (const entry of failures) {
              const code = entry.status?.code;
              if (code === 404 || code === 410) dead.set(entry.url, code);
            }

            const games = JSON.parse(fs.readFileSync("all-games.json", "utf8")).games ?? [];
            const platforms = [
              { label: "spotify", name: "Spotify", host: "open.spotify.com" },
              { label: "apple music", name: "Apple Music", host: "music.apple.com" },
            ];
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const today = new Date().toISOString().slice(0, 10);

            for (const platform of platforms) {
              const rows = [];
              for (const game of games) {
                for (const album of game.albums ?? []) {
                  for (const url of [album.spotify_url, album.apple_music_url]) {
                    if (url && url.includes(platform.host) && dead.has(url)) {
                      rows.push(`- [ ] **[${game.game_name}](${game.game_url})** — ${album.album_name} · [link](${url}) · IGDB ${game.igdb_id} · \`${dead.get(url)}\``);
                    }
                  }
                }
              }
              const title = `Broken ${platform.name} links`;
              const existing = (await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: "open", labels: `broken link,${platform.label}`, per_page: 100,
              })).find((issue) => !issue.pull_request && issue.title.startsWith(title));

              if (rows.length === 0) {
                if (existing) {
                  await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body: `All ${platform.name} links work again as of ${today} ([run](${runUrl})). Closing.` });
                  await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: "closed", state_reason: "completed" });
                }
                core.info(`${platform.name}: no broken links`);
                continue;
              }

              const body = [
                `${rows.length} ${platform.name} link${rows.length === 1 ? "" : "s"} in \`all-games.json\` returned **404/410** on ${today} ([run](${runUrl})).`,
                "",
                "The album was probably removed or moved. Fix it with an edit on ostdb.net (the game page → *submit / edit*) or a pull request with a corrected file in `submissions/` (see SUBMITTING.md), then tick it off here. This issue is rewritten by the next weekly check.",
                "",
                ...rows,
              ].join("\n");
              const fullTitle = `${title} (${rows.length})`;
              if (existing) {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, title: fullTitle, body });
                core.info(`${platform.name}: updated #${existing.number} with ${rows.length}`);
              } else {
                const { data } = await github.rest.issues.create({ owner, repo, title: fullTitle, body, labels: ["broken link", platform.label] });
                core.info(`${platform.name}: opened #${data.number} with ${rows.length}`);
              }
            }
            core.summary.addRaw(`Checked ${report.total ?? "?"} links, ${dead.size} dead (404/410).`).write();
